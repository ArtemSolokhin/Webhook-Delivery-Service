[project]
name = "webhook-delivery-service"
version = "0.1.0"
description = "A small Webhook Delivery Service (Django + Django Ninja + Celery + PostgreSQL)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.0,<5.1",
    "django-ninja>=1.1,<1.2",
    "celery[redis]>=5.3,<5.4",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.1,<3.2",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is a Django project, not an installable library - pyproject.toml
# is used purely as the dependency manifest, so no packages to build.
packages = []

[tool.ruff]
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
ignore = [
    # Django's Meta.ordering/indexes and Django Ninja's Schema field defaults
    # are mutated-copy-safe by construction; not the footgun this rule targets.
    "RUF012",
    # Django Ninja's `= Query(...)` default is the framework's own DI pattern,
    # not a shared mutable default.
    "B008",
]
